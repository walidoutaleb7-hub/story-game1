<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#080b12">

    <title>ظلال المجهول</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <!-- شاشة البداية -->
        <section id="startScreen" class="screen active">
            <div class="start-content">
                <div class="logo">✦</div>

                <p class="eyebrow">قصة تفاعلية</p>

                <h1>ظلال المجهول</h1>

                <p class="subtitle">
                    كل قرار تتخذه يغيّر الطريق.
                </p>

                <button id="continueBtn" class="main-btn">
                    متابعة القصة
                </button>

                <button id="newGameBtn" class="secondary-btn">
                    لعبة جديدة
                </button>
            </div>
        </section>


        <!-- اللعبة -->
        <section id="gameScreen" class="screen">

            <header class="topbar">

                <div class="game-name">
                    ظلال المجهول
                </div>

                <button id="menuBtn" class="icon-btn">
                    ☰
                </button>

            </header>


            <!-- معلومات اللاعب -->
            <div class="player-stats">

                <div class="stat">
                    <span>❤</span>
                    <strong id="health">100</strong>
                </div>

                <div class="stat">
                    <span>◆</span>
                    <strong id="coins">0</strong>
                </div>

                <div class="stat">
                    <span>◈</span>
                    <strong id="chapter">1</strong>
                </div>

            </div>


            <!-- التقدم -->
            <div class="progress-container">
                <div id="progressBar"></div>
            </div>


            <!-- المشهد -->
            <main class="story-container">

                <div class="chapter-label" id="chapterLabel">
                    الفصل الأول
                </div>

                <h2 id="sceneTitle">
                    ...
                </h2>

                <div class="scene-line"></div>

                <div id="storyText" class="story-text">
                    ...
                </div>

                <div id="choices" class="choices">
                </div>

            </main>


            <!-- معلومات إضافية -->
            <div class="bottom-actions">

                <button id="inventoryBtn">
                    🎒 الحقيبة
                </button>

                <button id="achievementsBtn">
                    🏆 الإنجازات
                </button>

            </div>

        </section>


        <!-- القائمة -->
        <div id="menuOverlay" class="overlay">

            <div class="menu-card">

                <button id="closeMenu" class="close-btn">
                    ×
                </button>

                <h2>القائمة</h2>

                <button id="saveBtn">💾 حفظ اللعبة</button>
                <button id="restartBtn">🔄 إعادة القصة</button>
                <button id="backHomeBtn">⌂ الرئيسية</button>

            </div>

        </div>


        <!-- الحقيبة -->
        <div id="inventoryOverlay" class="overlay">

            <div class="menu-card">

                <button class="close-btn" data-close="inventoryOverlay">
                    ×
                </button>

                <h2>🎒 الحقيبة</h2>

                <div id="inventoryList"></div>

            </div>

        </div>


        <!-- الإنجازات -->
        <div id="achievementsOverlay" class="overlay">

            <div class="menu-card">

                <button class="close-btn" data-close="achievementsOverlay">
                    ×
                </button>

                <h2>🏆 الإنجازات</h2>

                <div id="achievementsList"></div>

            </div>

        </div>


        <!-- شاشة النهاية -->
        <section id="endScreen" class="screen">

            <div class="end-content">

                <div id="endIcon" class="end-icon">
                    ✦
                </div>

                <p class="eyebrow">نهاية الفصل</p>

                <h1 id="endTitle">...</h1>

                <p id="endText"></p>

                <div class="end-stats">

                    <div>
                        <span>الفصل</span>
                        <strong id="finalChapter">1</strong>
                    </div>

                    <div>
                        <span>العملات</span>
                        <strong id="finalCoins">0</strong>
                    </div>

                    <div>
                        <span>الإنجازات</span>
                        <strong id="finalAchievements">0</strong>
                    </div>

                </div>

                <button id="restartFromEnd" class="main-btn">
                    العب من جديد
                </button>

            </div>

        </section>

    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
