<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#060810"
    >

    <meta
        name="description"
        content="ظلال المجهول — لعبة قصة تفاعلية"
    >

    <title>ظلال المجهول</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div id="app">


    <!-- =====================================================
         START SCREEN
    ====================================================== -->

    <section
        id="startScreen"
        class="screen active"
    >

        <div class="start-content">

            <div class="logo">
                ◈
            </div>

            <div class="eyebrow">
                STORY • ADVENTURE
            </div>

            <h1>
                ظلال المجهول
            </h1>

            <p class="subtitle">
                كل اختيار له أثر...
                <br>
                وكل باب يخفي قصة.
            </p>


            <button
                id="continueBtn"
                class="main-btn"
                style="display:none;"
            >
                متابعة الرحلة
            </button>


            <button
                id="newGameBtn"
                class="secondary-btn"
            >
                بدء قصة جديدة
            </button>

        </div>

    </section>



    <!-- =====================================================
         GAME SCREEN
    ====================================================== -->

    <section
        id="gameScreen"
        class="screen"
    >


        <!-- TOP BAR -->

        <header class="topbar">

            <button
                id="menuBtn"
                class="icon-btn"
                type="button"
                aria-label="القائمة"
            >
                ☰
            </button>


            <div class="game-name">
                ظلال المجهول
            </div>


            <div
                id="chapterLabel"
                class="chapter-label"
            >
                الفصل الأول
            </div>

        </header>



        <!-- =================================================
             PLAYER STATS
        ================================================== -->

        <div class="player-stats">


            <div class="stat">

                <span>
                    ❤
                </span>

                <strong id="health">
                    100
                </strong>

            </div>


            <div class="stat">

                <span>
                    ◆
                </span>

                <strong id="coins">
                    25
                </strong>

            </div>


            <div class="stat">

                <span>
                    الفصل
                </span>

                <strong id="chapterNumber">
                    1
                </strong>

            </div>

        </div>



        <!-- =================================================
             STORY PROGRESS
        ================================================== -->

        <div
            class="progress-container"
            aria-label="تقدم القصة"
        >

            <div
                id="progressBar"
            ></div>

        </div>



        <!-- =================================================
             STORY
        ================================================== -->

        <main class="story-container">


            <div
                id="storyChapterLabel"
                class="chapter-label"
                style="display:none;"
            >
                الفصل الأول
            </div>


            <h1 id="sceneTitle">
                البداية
            </h1>


            <div class="scene-line"></div>


            <div
                id="storyText"
                class="story-text fade"
            >
                ...
            </div>


            <!-- CHOICES -->

            <div
                id="choices"
                class="choices"
            ></div>


        </main>



        <!-- =================================================
             BOTTOM ACTIONS
        ================================================== -->

        <nav class="bottom-actions">


            <button
                id="inventoryBtn"
                type="button"
            >
                🎒 الحقيبة
            </button>


            <button
                id="achievementsBtn"
                type="button"
            >
                🏆 الإنجازات
            </button>

        </nav>

    </section>



    <!-- =====================================================
         MENU OVERLAY
    ====================================================== -->

    <div
        id="menuOverlay"
        class="overlay"
    >

        <div class="menu-card">


            <button
                id="closeMenu"
                class="close-btn"
                type="button"
                aria-label="إغلاق"
            >
                ×
            </button>


            <h2>
                القائمة
            </h2>


            <button
                id="saveBtn"
                type="button"
            >
                💾 حفظ اللعبة
            </button>


            <button
                id="restartBtn"
                type="button"
            >
                🔄 إعادة البداية
            </button>


            <button
                id="backHomeBtn"
                type="button"
            >
                🏠 الصفحة الرئيسية
            </button>

        </div>

    </div>



    <!-- =====================================================
         INVENTORY OVERLAY
    ====================================================== -->

    <div
        id="inventoryOverlay"
        class="overlay"
    >

        <div class="menu-card">


            <button
                class="close-btn"
                type="button"
                data-close="inventoryOverlay"
                aria-label="إغلاق"
            >
                ×
            </button>


            <h2>
                🎒 الحقيبة
            </h2>


            <div
                id="inventoryList"
            ></div>

        </div>

    </div>



    <!-- =====================================================
         ACHIEVEMENTS OVERLAY
    ====================================================== -->

    <div
        id="achievementsOverlay"
        class="overlay"
    >

        <div class="menu-card">


            <button
                class="close-btn"
                type="button"
                data-close="achievementsOverlay"
                aria-label="إغلاق"
            >
                ×
            </button>


            <h2>
                🏆 الإنجازات
            </h2>


            <div
                id="achievementsList"
            ></div>

        </div>

    </div>



    <!-- =====================================================
         END SCREEN
    ====================================================== -->

    <section
        id="endScreen"
        class="screen"
    >

        <div class="end-content">


            <div
                id="endIcon"
                class="end-icon"
            >
                ✦
            </div>


            <div class="eyebrow">
                STORY COMPLETE
            </div>


            <h1 id="endTitle">
                البداية فقط
            </h1>


            <p id="endText">
                لقد أنهيت الرحلة.
            </p>



            <!-- FINAL STATS -->

            <div class="end-stats">


                <div>

                    <span>
                        الفصل
                    </span>

                    <strong id="finalChapter">
                        1
                    </strong>

                </div>


                <div>

                    <span>
                        العملات
                    </span>

                    <strong id="finalCoins">
                        25
                    </strong>

                </div>


                <div>

                    <span>
                        الإنجازات
                    </span>

                    <strong id="finalAchievements">
                        0
                    </strong>

                </div>

            </div>



            <button
                id="restartFromEnd"
                class="main-btn"
                type="button"
            >
                العب من جديد
            </button>

        </div>

    </section>

</div>



<!-- =========================================================
     GAME DATA
========================================================= -->

<script src="data.js"></script>


<!-- =========================================================
     GAME ENGINE
========================================================= -->

<script src="script.js"></script>


</body>

</html>
