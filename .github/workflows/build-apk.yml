name: Build Shadows Unknown APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android project
        run: |
          rm -rf app/src/main/java

          mkdir -p app/src/main/java/com/shadowsunknown/game
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

      - name: Check application icon
        run: |
          if [ ! -f "app/src/main/res/drawable/app_icon.png" ]; then
            echo "ERROR: app_icon.png not found!"
            echo "Expected location:"
            echo "app/src/main/res/drawable/app_icon.png"
            exit 1
          fi

          echo "Icon found successfully:"
          ls -lh app/src/main/res/drawable/app_icon.png

      - name: Verify game files
        run: |
          echo "=============================="
          echo "CHECKING GAME FILES"
          echo "=============================="

          REQUIRED_FILES=(
            "index.html"
            "style.css"
            "script.js"
            "data.js"
            "effects.js"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "app/src/main/assets/$FILE" ]; then
              echo "ERROR: Missing game file:"
              echo "app/src/main/assets/$FILE"
              exit 1
            fi

            echo "FOUND: $FILE"
          done

          echo ""
          echo "All required game files found successfully."

      - name: Create settings.gradle
        run: |
          printf '%s\n' \
          'pluginManagement {' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '        gradlePluginPortal()' \
          '    }' \
          '}' \
          '' \
          'dependencyResolutionManagement {' \
          '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
          '    repositories {' \
          '        google()' \
          '        mavenCentral()' \
          '    }' \
          '}' \
          '' \
          'rootProject.name = "ShadowsUnknown"' \
          'include(":app")' \
          > settings.gradle

      - name: Create root build.gradle
        run: |
          printf '%s\n' \
          'plugins {' \
          '    id "com.android.application" version "8.7.3" apply false' \
          '}' \
          > build.gradle

      - name: Create app build.gradle
        run: |
          printf '%s\n' \
          'plugins {' \
          '    id "com.android.application"' \
          '}' \
          '' \
          'android {' \
          '    namespace "com.shadowsunknown.game"' \
          '    compileSdk 35' \
          '' \
          '    defaultConfig {' \
          '        applicationId "com.shadowsunknown.game"' \
          '        minSdk 23' \
          '        targetSdk 35' \
          '        versionCode 1' \
          '        versionName "1.0"' \
          '    }' \
          '}' \
          > app/build.gradle

      - name: Create AndroidManifest.xml
        run: |
          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
          '' \
          '    <application' \
          '        android:allowBackup="true"' \
          '        android:supportsRtl="true"' \
          '        android:label="ظلال المجهول"' \
          '        android:icon="@drawable/app_icon"' \
          '        android:roundIcon="@drawable/app_icon"' \
          '        android:theme="@style/AppTheme">' \
          '' \
          '        <activity' \
          '            android:name=".MainActivity"' \
          '            android:screenOrientation="portrait"' \
          '            android:exported="true">' \
          '' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN" />' \
          '                <category android:name="android.intent.category.LAUNCHER" />' \
          '            </intent-filter>' \
          '' \
          '        </activity>' \
          '' \
          '    </application>' \
          '' \
          '</manifest>' \
          > app/src/main/AndroidManifest.xml

      - name: Create styles.xml
        run: |
          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<resources>' \
          '' \
          '    <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">' \
          '        <item name="android:fontFamily">sans</item>' \
          '        <item name="android:windowLightStatusBar">false</item>' \
          '        <item name="android:statusBarColor">#060810</item>' \
          '        <item name="android:navigationBarColor">#060810</item>' \
          '    </style>' \
          '' \
          '</resources>' \
          > app/src/main/res/values/styles.xml

      - name: Create MainActivity.java
        run: |
          printf '%s\n' \
          'package com.shadowsunknown.game;' \
          '' \
          'import android.app.Activity;' \
          'import android.os.Bundle;' \
          'import android.webkit.WebSettings;' \
          'import android.webkit.WebView;' \
          'import android.webkit.WebViewClient;' \
          '' \
          'public class MainActivity extends Activity {' \
          '' \
          '    private WebView webView;' \
          '' \
          '    @Override' \
          '    protected void onCreate(Bundle savedInstanceState) {' \
          '        super.onCreate(savedInstanceState);' \
          '' \
          '        webView = new WebView(this);' \
          '' \
          '        WebSettings settings = webView.getSettings();' \
          '        settings.setJavaScriptEnabled(true);' \
          '        settings.setDomStorageEnabled(true);' \
          '        settings.setAllowFileAccess(true);' \
          '        settings.setAllowContentAccess(true);' \
          '' \
          '        webView.setWebViewClient(new WebViewClient());' \
          '        webView.loadUrl("file:///android_asset/index.html");' \
          '' \
          '        setContentView(webView);' \
          '    }' \
          '' \
          '    @Override' \
          '    public void onBackPressed() {' \
          '        if (webView != null && webView.canGoBack()) {' \
          '            webView.goBack();' \
          '        } else {' \
          '            super.onBackPressed();' \
          '        }' \
          '    }' \
          '}' \
          > app/src/main/java/com/shadowsunknown/game/MainActivity.java

      - name: Verify project
        run: |
          echo "=============================="
          echo "JAVA FILES"
          echo "=============================="

          find app/src/main/java -type f -name "*.java" -print

          echo ""
          echo "=============================="
          echo "RESOURCES"
          echo "=============================="

          find app/src/main/res -type f -print

          echo ""
          echo "=============================="
          echo "ICON"
          echo "=============================="

          ls -lh app/src/main/res/drawable/app_icon.png

          echo ""
          echo "=============================="
          echo "GAME ASSETS"
          echo "=============================="

          find app/src/main/assets -type f -print

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "=============================="
          echo "APK GENERATED SUCCESSFULLY"
          echo "=============================="

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shadows-unknown-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error