name: Build Shadows Unknown APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Create Android project
        run: |

          mkdir -p app/src/main/java/com/shadowsunknown/game
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi


      - name: Copy game files
        run: |

          cp index.html app/src/main/assets/index.html
          cp style.css app/src/main/assets/style.css
          cp script.js app/src/main/assets/script.js
          cp data.js app/src/main/assets/data.js

          if [ -d "assets" ]; then
            cp -r assets/* app/src/main/assets/ || true
          fi


      - name: Copy application icon
        run: |

          if [ -f "app/src/main/res/drawable/app_icon.png" ]; then
            echo "Icon already exists."
          else
            echo "Icon not found in drawable."
          fi


      - name: Create settings.gradle
        run: |

          cat > settings.gradle <<'EOF'

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ShadowsUnknown"

          include(":app")

          EOF


      - name: Create root build.gradle
        run: |

          cat > build.gradle <<'EOF'

          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }

          EOF


      - name: Create app build.gradle
        run: |

          cat > app/build.gradle <<'EOF'

          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.shadowsunknown.game'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.shadowsunknown.game'

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName '1.0'
              }
          }

          EOF


      - name: Create AndroidManifest
        run: |

          cat > app/src/main/AndroidManifest.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application

                  android:theme="@style/AppTheme"

                  android:label="ظلال المجهول"

                  android:allowBackup="true"

                  android:supportsRtl="true"

                  android:icon="@drawable/app_icon"

                  android:roundIcon="@drawable/app_icon">

                  <activity

                      android:name=".MainActivity"

                      android:screenOrientation="portrait"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>

          EOF


      - name: Create theme
        run: |

          cat > app/src/main/res/values/styles.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">false</item>

                  <item name="android:statusBarColor">#060810</item>

                  <item name="android:navigationBarColor">#060810</item>

              </style>

          </resources>

          EOF


      - name: Create MainActivity
        run: |

          cat > app/src/main/java/com/shadowsunknown/game/MainActivity.java <<'EOF'

          package com.shadowsunknown.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }

          EOF


      - name: Verify project
        run: |

          echo "===== Project ====="

          find app/src/main -maxdepth 4 -type f | sort

          echo "===== Assets ====="

          ls -lah app/src/main/assets

          echo "===== Icon ====="

          ls -lah app/src/main/res/drawable/app_icon.png


      - name: Build APK
        run: |

          gradle assembleDebug --stacktrace


      - name: Find APK
        run: |

          echo "===== APK FILES ====="

          find app/build/outputs/apk -type f -name "*.apk" -print


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: shadows-unknown-apk

          path: app/build/outputs/apk/debug/*.apk

          if-no-files-found: error