name: Build Shadows Unknown APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/shadowsunknown/game
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

      - name: Copy game files
        shell: bash
        run: |
          set -e

          cp index.html app/src/main/assets/index.html
          cp style.css app/src/main/assets/style.css
          cp script.js app/src/main/assets/script.js
          cp data.js app/src/main/assets/data.js

          if [ -d "assets" ]; then
            cp -r assets/. app/src/main/assets/
          fi

      - name: Verify icon
        shell: bash
        run: |
          set -e

          if [ ! -f "app/src/main/res/drawable/app_icon.png" ]; then
            echo "ERROR: app_icon.png is missing."
            exit 1
          fi

          file app/src/main/res/drawable/app_icon.png
          ls -lh app/src/main/res/drawable/app_icon.png

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "ShadowsUnknown"

include(":app")
EOF

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF

      - name: Create app build.gradle
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shadowsunknown.game'

    compileSdk 35

    defaultConfig {
        applicationId 'com.shadowsunknown.game'

        minSdk 23
        targetSdk 35

        versionCode 1
        versionName '1.0'
    }
}
EOF

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <application
        android:allowBackup="true"
        android:supportsRtl="true"
        android:label="ظلال المجهول"
        android:icon="@drawable/app_icon"
        android:roundIcon="@drawable/app_icon"
        android:theme="@style/AppTheme">

        <activity
            android:name=".MainActivity"
            android:screenOrientation="portrait"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

      - name: Create styles.xml
        shell: bash
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>

    <style
        name="AppTheme"
        parent="android:style/Theme.Material.NoActionBar">

        <item name="android:fontFamily">sans</item>
        <item name="android:windowLightStatusBar">false</item>
        <item name="android:statusBarColor">#060810</item>
        <item name="android:navigationBarColor">#060810</item>

    </style>

</resources>
EOF

      - name: Create MainActivity.java
        shell: bash
        run: |
          cat > app/src/main/java/com/shadowsunknown/game/MainActivity.java <<'EOF'
package com.shadowsunknown.game;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

public class MainActivity extends Activity {

    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        webView = new WebView(this);

        WebSettings settings = webView.getSettings();

        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(true);

        webView.setWebViewClient(new WebViewClient());

        webView.loadUrl("file:///android_asset/index.html");

        setContentView(webView);
    }

    @Override
    public void onBackPressed() {
        if (webView != null && webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }
}
EOF

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "===== MAIN FILES ====="
          find app/src/main -maxdepth 5 -type f | sort

          echo ""
          echo "===== GAME ASSETS ====="
          ls -lh app/src/main/assets/

          echo ""
          echo "===== ICON ====="
          ls -lh app/src/main/res/drawable/app_icon.png

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shadows-unknown-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error